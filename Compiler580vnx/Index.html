<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>580VNX ROP Compiler · Handsome Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0800;
  --paper:  #110e00;
  --panel:  #160f00;
  --border: #3a2800;
  --border2:#4d3500;
  --amber:  #ffb000;
  --amber2: #ff8c00;
  --amber3: #ffdb80;
  --dim:    #7a5800;
  --dimmer: #3d2c00;
  --red:    #ff4400;
  --green:  #39ff14;
  --text:   #ffe066;
}

*{box-sizing:border-box;margin:0;padding:0}

/* CRT scanline overlay */
body::before {
  content:'';
  position:fixed;inset:0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.15) 2px,
    rgba(0,0,0,0.15) 4px
  );
  pointer-events:none;
  z-index:9999;
}

body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  min-height:100vh;
  color: var(--amber);
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,160,0,0.06) 0%, transparent 70%);
}

/* ── LOADER ─────────────────────────────────── */
#pyodideLoader {
  position:fixed;inset:0;
  background: var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9998;gap:14px;
}
.loader-icon { font-size:2rem; animation: spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loader-text {
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;
  color: var(--amber);
  letter-spacing:.15em;
  text-shadow: 0 0 20px var(--amber2);
}
.loader-sub { color: var(--dim); font-size:.8rem; }
.loader-bar-wrap {
  width:260px;height:4px;
  background:var(--border);
  border:1px solid var(--border2);
}
.loader-bar {
  height:100%;width:0%;
  background: var(--amber);
  box-shadow: 0 0 10px var(--amber2);
  transition:width .4s;
}

/* ── WRAPPER ────────────────────────────────── */
.wrap { width:100%; max-width:1100px; }

/* ── HEADER ─────────────────────────────────── */
.header {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 10px 20px;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  position: relative;
}

.header::before,
.header::after {
  content:'';
  position:absolute;
  width:10px;height:10px;
  border-color:var(--amber);
  border-style:solid;
}
.header::before { top:-1px;left:-1px; border-width:2px 0 0 2px; }
.header::after  { top:-1px;right:-1px; border-width:2px 2px 0 0; }

.title-block { display:flex;align-items:center;gap:14px; }

h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;
  letter-spacing:.12em;
  color: var(--amber);
  text-shadow: 0 0 16px var(--amber2), 0 0 40px rgba(255,140,0,.3);
  animation: flicker 8s infinite;
}

@keyframes flicker {
  0%,95%,100% { opacity:1; }
  96% { opacity:.85; }
  97% { opacity:1; }
  98% { opacity:.7; }
  99% { opacity:1; }
}

h1 span { color: var(--amber3); }

.credit {
  font-size:.7rem;
  color: var(--dim);
  border: 1px solid var(--border);
  padding: 3px 10px;
  letter-spacing:.08em;
}
.credit b { color: var(--amber2); }

/* ── TOOLBAR ────────────────────────────────── */
.toolbar {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 8px 16px;
  background: var(--paper);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

button {
  background: transparent;
  border: 1px solid var(--border2);
  padding: 5px 14px;
  font-family: 'Share Tech Mono', monospace;
  font-size: .75rem;
  color: var(--dim);
  cursor: pointer;
  letter-spacing: .06em;
  transition: all .12s;
  text-transform: uppercase;
  position: relative;
}
button:hover {
  color: var(--amber);
  border-color: var(--amber);
  background: rgba(255,176,0,.07);
  box-shadow: 0 0 10px rgba(255,176,0,.15), inset 0 0 10px rgba(255,176,0,.04);
}
button:active { transform: scale(.97); }

#compileBtn {
  color: var(--amber);
  border-color: var(--amber2);
  background: rgba(255,140,0,.08);
  box-shadow: 0 0 12px rgba(255,140,0,.2);
  font-size: .8rem;
}
#compileBtn:hover {
  background: rgba(255,140,0,.18);
  box-shadow: 0 0 20px rgba(255,140,0,.35);
}
#compileBtn:disabled { opacity:.3; cursor:not-allowed; transform:none; }

#clearBtn { color:var(--red); border-color:rgba(255,68,0,.4); }
#clearBtn:hover { background:rgba(255,68,0,.1); border-color:var(--red); box-shadow:0 0 10px rgba(255,68,0,.2); }

#copyHexBtn,#copyKeyBtn { color:var(--green); border-color:rgba(57,255,20,.3); }
#copyHexBtn:hover,#copyKeyBtn:hover { background:rgba(57,255,20,.07); border-color:var(--green); box-shadow:0 0 10px rgba(57,255,20,.15); }

#pasteBtn { color:var(--amber3); border-color:rgba(255,219,128,.3); }

.fmt-switch {
  margin-left:auto;
  display:flex;gap:0;
  border:1px solid var(--border2);
}
.fmt-btn {
  border:none;border-radius:0;
  padding:5px 16px;
  font-size:.72rem;
  color:var(--dim);
  background:transparent;
}
.fmt-btn.active {
  color:var(--bg);
  background:var(--amber);
  box-shadow:none;
}
.fmt-btn.active:hover {
  background:var(--amber2);
  box-shadow:none;
  border:none;
}
.fmt-btn:hover:not(.active){
  background:rgba(255,176,0,.1);
  border:none;
  box-shadow:none;
}

/* ── EXAMPLES ───────────────────────────────── */
.examples-row {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 7px 16px;
  background: var(--paper);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.examples-label {
  font-size:.65rem;color:var(--dimmer);
  margin-right:4px;letter-spacing:.1em;
  text-transform:uppercase;
}
.ex-btn {
  font-size:.68rem;padding:3px 10px;
  color:var(--dimmer);
  border-color:var(--border);
}
.ex-btn:hover {
  color:var(--amber3);
  border-color:var(--amber3);
  background:rgba(255,219,128,.06);
  box-shadow:none;
}

/* ── PANELS ─────────────────────────────────── */
.main-border {
  border: 1px solid var(--border2);
  background: var(--paper);
  position: relative;
}
.main-border::before,
.main-border::after {
  content:'';position:absolute;
  width:10px;height:10px;
  border-color:var(--amber);border-style:solid;
}
.main-border::before { bottom:-1px;left:-1px; border-width:0 0 2px 2px; }
.main-border::after  { bottom:-1px;right:-1px; border-width:0 2px 2px 0; }

.panels {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
}
@media(max-width:640px){.panels{grid-template-columns:1fr}}

.panel { padding:14px 18px 18px; }
.panel:first-child { border-right:1px solid var(--border); }

.panel-label {
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:var(--dim);
  display:block;
  margin-bottom:8px;
}

textarea, #outputBox {
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--amber);
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;
  padding:12px 14px;
  outline:none;
  line-height:1.65;
  transition:border-color .2s;
}
textarea {
  resize:vertical;
  min-height:300px;
}
textarea:focus {
  border-color:var(--amber2);
  box-shadow:0 0 0 2px rgba(255,140,0,.12), inset 0 0 20px rgba(255,140,0,.03);
}
textarea::placeholder { color:var(--dimmer); }

#outputBox {
  min-height:300px;
  max-height:520px;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-all;
  color:var(--text);
  scrollbar-width:thin;
  scrollbar-color:var(--border2) transparent;
}
#outputBox::-webkit-scrollbar { width:4px; }
#outputBox::-webkit-scrollbar-thumb { background:var(--border2); }

/* ── STATUS ─────────────────────────────────── */
.status-row {
  border:1px solid var(--border2);
  border-top:1px solid var(--border);
  padding:7px 18px;
  background:var(--panel);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:8px;
}
.status-pill {
  font-size:.72rem;color:var(--dim);
  font-family:'Share Tech Mono',monospace;
  transition:color .3s;
}
.stats-pill {
  font-size:.68rem;color:var(--dimmer);
  font-family:'Share Tech Mono',monospace;
}

/* ── OUTPUT TOKENS ──────────────────────────── */
.tok-hex   { color:#ffb000; }
.tok-key   { color:#ffe066; font-weight:bold; }
.tok-addr  { color:#ff8c00; }
.tok-err   { color:#ff4400; }
.tok-note  { color:#3d2c00; }
.tok-ok    { color:#39ff14; }
.tok-label { color:#7a5800; font-size:.85em; }
</style>
</head>
<body>

<!-- PYODIDE LOADING OVERLAY -->
<div id="pyodideLoader">
  <div class="loader-icon">⚙</div>
  <div class="loader-text">Initialising Runtime</div>
  <div class="loader-sub">Loading Pyodide — first boot ~5s…</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
  <div class="loader-sub" id="loaderMsg">Fetching…</div>
</div>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="title-block">
      <h1>580VNX <span>ROP</span> COMPILER</h1>
    </div>
    <div class="credit">by <b>@liemdeptrai</b> · Handsome Boy</div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button id="compileBtn" disabled>[ COMPILE ]</button>
    <button id="pasteBtn">[ PASTE ]</button>
    <button id="clearBtn">[ CLEAR ]</button>
    <button id="copyHexBtn">[ COPY HEX ]</button>
    <button id="copyKeyBtn">[ COPY KEY ]</button>
    <div class="fmt-switch">
      <button class="fmt-btn active" id="fmtHex">HEX</button>
      <button class="fmt-btn" id="fmtKey">KEY</button>
    </div>
  </div>

  <!-- EXAMPLES -->
  <div class="examples-row">
    <span class="examples-label">// examples</span>
    <button class="ex-btn" data-example="hello">hello_world</button>
    <button class="ex-btn" data-example="waitshift">waitshift</button>
    <button class="ex-btn" data-example="drawline">draw_line</button>
    <button class="ex-btn" data-example="loop">loop_goto</button>
    <button class="ex-btn" data-example="str">multi_str</button>
  </div>

  <!-- PANELS -->
  <div class="main-border">
    <div class="panels">
      <div class="panel">
        <span class="panel-label">// asm source</span>
        <textarea id="asmInput" spellcheck="false" placeholder="org 0xe9e0&#10;&#10;setlr&#10;xr0 = 0x1111, adr_of text&#10;printline&#10;render.ddd4&#10;waitshift&#10;&#10;text:&#10;str &quot;Hello~World&quot;"></textarea>
      </div>
      <div class="panel">
        <span class="panel-label">// output</span>
        <div id="outputBox"><span class="tok-note">// ready — press [ COMPILE ] or ctrl+enter</span></div>
      </div>
    </div>

    <!-- STATUS -->
    <div class="status-row">
      <div class="status-pill" id="statusMsg">&gt; ready_</div>
      <div class="stats-pill" id="statsMsg"></div>
    </div>
  </div>

</div>

    if '+' in line and line[:line.find('+')] in datalabels:
        label, offset = line.split('+')
        process(f'0x{datalabels[label]+int(offset,0):04x}'); return

    if line in commands:
        process('call '+to_lowercase(line)); return

    if line.startswith('pr_length'):
        pr_length_cmds.append(len(result))
        result.extend((0,0)); return

    if line.startswith('str'):
        content = line[3:].strip()
        def string_to_bytes(text):
            bl=[]
            for c in text:
                try:
                    hv = char_to_hex[c]
                    if len(hv)==2: bl.append(int(hv,16))
                    elif len(hv)==4: bl.extend([int(hv[:2],16),int(hv[2:],16)])
                except KeyError: raise ValueError(f"Char '{c}' not in table")
            return bl
        if '"' in content:
            qp=content.find('"')
            vn=content[:qp].strip() if qp>0 else None
            text=content[qp+1:].rstrip('"')
            if vn: string_vars[vn]=text
            else: result.extend(string_to_bytes(text))
        elif content:
            vn=content.strip()
            if vn in string_vars: result.extend(string_to_bytes(string_vars[vn]))
            else: raise ValueError(f'Undefined string var: {vn}')
        else: raise ValueError('Invalid str syntax')
        return

    if '=' in line:
        i=line.index('=')
        register, value = line[:i], line[i+1:].lstrip()
        assert '=' not in value
        # Split on commas but preserve 'adr_of [offset] label' as one unit
        def split_value(v):
            parts = []; buf = ''; toks = v.split(',')
            j = 0
            while j < len(toks):
                t = toks[j].strip()
                if not buf:
                    buf = t
                else:
                    buf = buf + ',' + t
                # adr_of is complete when: no [ at all, OR brackets balanced
                s = buf.strip()
                if s.startswith('adr_of'):
                    if '[' not in s or s.count('[') == s.count(']'):
                        parts.append(s); buf = ''
                else:
                    parts.append(s); buf = ''
                j += 1
            if buf: parts.append(buf.strip())
            return parts
        process(f'call pop {register}')
        l1=len(result)
        for p in split_value(value):
            process(p)
        assert len(result)-l1==sizeof_register(register), f'Size mismatch in: {line}'
        return

    if line.startswith('org'):
        global home
        hx=eval(line[3:])
        home1=hx-len(result)
        assert home is None or home==home1,'Inconsistent home'
        home=home1; return

    if line.startswith('adr_arith'):
        lmp=len(line)-1
        while lmp>0:
            if line[lmp]=='-' and 'adr_arith' in line[lmp:]: break
            lmp-=1
        if lmp<=0: raise ValueError(f'Invalid adr_arith: {line}')
        left_part=line[9:lmp].strip()
        right_part=line[lmp+1:].strip()
        def parse_part(part):
            part=part.strip()
            if part.startswith('adr_arith'): part=part[9:].strip()
            offset=0
            if '[' in part and ']' in part:
                si=part.index('['); ei=part.index(']')
                offset=int(part[si+1:ei],0)
                label=part[ei+1:].strip()
            else: label=part.strip()
            return offset, label
        lo,ll=parse_part(left_part)
        ro,rl=parse_part(right_part)
        adr_arith_cmds.append((len(result),lo,ll,ro,rl))
        result.append(0); return

    if line.startswith('$'):
        x=eval(line[1:])
        if isinstance(x,str): process(x)
        elif isinstance(x,(list,tuple)):
            for c in x: process(c)
        return

    if line.startswith('setup_loop'):
        parts=line.split(',')
        if len(parts)==2: src=parts[0].split()[1].strip(); sb=parts[1].strip(); lbl='home'
        elif len(parts)==3: src=parts[0].split()[1].strip(); sb=parts[1].strip(); lbl=parts[2].strip() if parts[2].strip()!='None' else 'home'
        else: raise ValueError(f'Invalid setup_loop: {line}')
        code=f"""restore:
    setlr
    DI,RT
    xr0=adr_of length,0x01,0x00
    [er0]=er2,rt
    qr0=pr_length,{sb},{src},0x0000
    0x8932
length:
    0x0800
    0x0000
set_sp:
    er6=adr_of [-2] {lbl}
    sp=er6,pop er8"""
        for cl in code.strip().split('\\n'): process(canonicalize(del_inline_comment(cl)).lower())
        return

    assert False, f'Unrecognized: {line!r}'

def finish_processing():
    global result
    for pos,ll,left_lbl,rl,right_lbl in adr_arith_cmds:
        la=labels[left_lbl]+ll; ra=labels[right_lbl]+rl
        result[pos]=(la-ra)&0xFF
    for pos in pr_length_cmds:
        pl=len(result)
        result[pos]=pl&0xFF; result[pos+1]=(pl>>8)&0xFF

def compile_program(source_text, fmt='hex'):
    reset_state()
    program=[canonicalize(del_inline_comment(l)) for l in source_text.split('\\n')]
    for line in program:
        if not line.lower().startswith('str'):
            line=to_lowercase(line)
        try: process(line)
        except Exception as e:
            raise RuntimeError(f'Error on line {repr(line)}: {e}') from e
    finish_processing()
    adr_resolved=[(sa, labels[tl]+off) for sa,off,tl in adr_of_cmds]
    overflow_sp=0xE9E0
    global home
    if home is None:
        home=overflow_sp
        if 'home' in labels: home-=labels['home']
    for sa,ho in adr_resolved:
        ta=home+ho
        result[sa]=ta&0xFF; result[sa+1]=ta>>8

    # Build label info string
    label_lines = []
    for lbl, off in sorted(labels.items(), key=lambda x: x[1]):
        label_lines.append(f'{lbl}: 0x{home+off:04X}')

    if fmt=='hex':
        output = f'0x{home:04x}: ' + ' '.join(f'{b:02x}' for b in result)
    else:
        output = f'0x{home:04x}: ' + ' '.join(byte_to_key(b) for b in result)

    return output, '\\n'.join(label_lines), len(result)

print("Compiler ready! Commands:", len(commands), "| Data labels:", len(datalabels))
`);

  loaderBar.style.width = '100%';
  loaderMsg.textContent = 'Ready!';
  await new Promise(r => setTimeout(r, 400));

  document.getElementById('pyodideLoader').style.display = 'none';
  compileBtn.disabled = false;
  setStatus('✅ Compiler ready');
}

loadPyodide_().catch(e => {
  loaderMsg.textContent = 'Failed: ' + e.message;
  loaderMsg.style.color = '#ff5370';
  setStatus('❌ Failed to load Python: ' + e.message, true);
});

// ═══════════════════════════════════════════════════
// COMPILE
// ═══════════════════════════════════════════════════
async function doCompile(fmt) {
  if (!pyodide) { setStatus('⏳ Python not ready', true); return; }
  const src = asmInput.value.trim();
  if (!src) { setStatus('⚠️ No source code', true); return; }

  compileBtn.disabled = true;
  setStatus('⏳ Compiling…');
  setOutput('<span class="tok-note">// Compiling…</span>');

  try {
    const t0 = performance.now();
    pyodide.globals.set('_src', src);
    pyodide.globals.set('_fmt', fmt);
    const res = await pyodide.runPythonAsync('compile_program(_src, _fmt)');
    const [out, labelInfo, byteCount] = res.toJs();
    const dt = ((performance.now() - t0) / 1000).toFixed(3);

    // Parse output  e.g. "0xe9e0: aa bb cc ..."
    const colonIdx = out.indexOf(':');
    const addr = out.slice(0, colonIdx);
    const bytes = out.slice(colonIdx + 1).trim();
    const byteArr = bytes.split(' ');

    let labelHtml = '';
    if (labelInfo) {
      const lines = labelInfo.split('\n').map(l => {
        const [name, adr] = l.split(': ');
        return `<span class="tok-note">; ${escHtml(name)}: <span class="tok-addr">${adr}</span></span>`;
      });
      labelHtml = '\n\n' + lines.join('\n');
    }

    if (fmt === 'hex') {
      lastHexResult = out;
      const colored = byteArr.map(b => `<span class="tok-hex">${b}</span>`).join(' ');
      setOutput(`<span class="tok-addr">${addr}:</span>\n${colored}${labelHtml}`);
    } else {
      lastKeyResult = out;
      const colored = byteArr.map(b =>
        b.startsWith('<') ? `<span class="tok-key">${b}</span>` : `<span class="tok-hex">${b}</span>`
      ).join(' ');
      setOutput(`<span class="tok-addr">${addr}:</span>\n${colored}${labelHtml}`);
    }

    statsMsg.textContent = `bytes: ${byteCount} | time: ${dt}s`;
    setStatus(`✅ Compiled — ${byteCount} bytes`);
  } catch(e) {
    const msg = e.message || String(e);
    setOutput(`<span class="tok-err">// Compile error:\n${escHtml(msg)}</span>`);
    setStatus('❌ Compile error', true);
    statsMsg.textContent = '';
  } finally {
    compileBtn.disabled = false;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════
// FORMAT SWITCH — recompile if we have source
// ═══════════════════════════════════════════════════
fmtHex.onclick = () => {
  currentFmt = 'hex';
  fmtHex.classList.add('active'); fmtKey.classList.remove('active');
  if (asmInput.value.trim()) doCompile('hex');
};
fmtKey.onclick = () => {
  currentFmt = 'key';
  fmtKey.classList.add('active'); fmtHex.classList.remove('active');
  if (asmInput.value.trim()) doCompile('key');
};

compileBtn.onclick = () => doCompile(currentFmt);

// Ctrl+Enter to compile
asmInput.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doCompile(currentFmt); }
});

clearBtn.onclick = () => {
  asmInput.value = '';
  setOutput('<span class="tok-note">// Press COMPILE or Ctrl+Enter</span>');
  statsMsg.textContent = '';
  lastHexResult = ''; lastKeyResult = '';
  setStatus('🧹 Cleared');
};

copyHexBtn.onclick = async () => {
  const txt = lastHexResult || outputBox.innerText;
  if (!txt || txt.includes('// ')) { setStatus('⚠️ Nothing to copy', true); return; }
  await navigator.clipboard.writeText(txt).then(() => setStatus('📋 Hex copied')).catch(() => setStatus('❌ Copy failed', true));
};

copyKeyBtn.onclick = async () => {
  if (!asmInput.value.trim()) { setStatus('⚠️ Nothing to copy', true); return; }
  // compile key mode on demand
  compileBtn.disabled = true;
  try {
    pyodide.globals.set('_src', asmInput.value.trim());
    const out = await pyodide.runPythonAsync("compile_program(_src, 'key')");
    lastKeyResult = out;
    await navigator.clipboard.writeText(out).then(() => setStatus('🔑 Key copied')).catch(() => setStatus('❌ Copy failed', true));
  } catch(e) { setStatus('❌ Key compile failed', true); }
  finally { compileBtn.disabled = false; }
};

pasteBtn.onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    asmInput.value = t;
    setStatus('📌 Pasted');
  } catch { setStatus('⚠️ Clipboard read failed', true); }
};

// Example buttons
document.querySelectorAll('.ex-btn').forEach(btn => {
  btn.onclick = () => {
    const key = btn.dataset.example;
    asmInput.value = EXAMPLES[key] || '';
    setOutput('<span class="tok-note">// Press COMPILE or Ctrl+Enter</span>');
    statsMsg.textContent = '';
    setStatus('📂 Example loaded');
  };
});
