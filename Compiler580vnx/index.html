<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>580VNX ROP Compiler · Handsome Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0800;
  --paper:  #110e00;
  --panel:  #160f00;
  --border: #3a2800;
  --border2:#4d3500;
  --amber:  #ffb000;
  --amber2: #ff8c00;
  --amber3: #ffdb80;
  --dim:    #7a5800;
  --dimmer: #3d2c00;
  --red:    #ff4400;
  --green:  #39ff14;
  --text:   #ffe066;
}

*{box-sizing:border-box;margin:0;padding:0}

/* CRT scanline overlay */
body::before {
  content:'';
  position:fixed;inset:0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.15) 2px,
    rgba(0,0,0,0.15) 4px
  );
  pointer-events:none;
  z-index:9999;
}

body {
  background: var(--bg);
  font-family: 'Share Tech Mono', monospace;
  min-height:100vh;
  color: var(--amber);
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,160,0,0.06) 0%, transparent 70%);
}

/* ── INLINE LOADER ──────────────────────────── */
#pyodideLoader {
  display: none; /* removed fullscreen overlay */
}
.compile-loading-bar {
  height: 2px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.compile-loading-bar .bar-fill {
  height: 100%;
  width: 0%;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber2);
  transition: width .4s;
}
.compile-loading-bar.indeterminate .bar-fill {
  width: 40%;
  animation: slide 1.2s infinite linear;
}
@keyframes slide {
  0%   { margin-left: -40%; }
  100% { margin-left: 100%; }
}

/* ── WRAPPER ────────────────────────────────── */
.wrap { width:100%; max-width:1100px; }

/* ── HEADER ─────────────────────────────────── */
.header {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 10px 20px;
  background: var(--panel);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  position: relative;
}

.header::before,
.header::after {
  content:'';
  position:absolute;
  width:10px;height:10px;
  border-color:var(--amber);
  border-style:solid;
}
.header::before { top:-1px;left:-1px; border-width:2px 0 0 2px; }
.header::after  { top:-1px;right:-1px; border-width:2px 2px 0 0; }

.title-block { display:flex;align-items:center;gap:14px; }

h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;
  letter-spacing:.12em;
  color: var(--amber);
  text-shadow: 0 0 16px var(--amber2), 0 0 40px rgba(255,140,0,.3);
  animation: flicker 8s infinite;
}

@keyframes flicker {
  0%,95%,100% { opacity:1; }
  96% { opacity:.85; }
  97% { opacity:1; }
  98% { opacity:.7; }
  99% { opacity:1; }
}

h1 span { color: var(--amber3); }

.credit {
  font-size:.7rem;
  color: var(--dim);
  border: 1px solid var(--border);
  padding: 3px 10px;
  letter-spacing:.08em;
}
.credit b { color: var(--amber2); }

/* ── TOOLBAR ────────────────────────────────── */
.toolbar {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 8px 16px;
  background: var(--paper);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

button {
  background: transparent;
  border: 1px solid var(--border2);
  padding: 5px 14px;
  font-family: 'Share Tech Mono', monospace;
  font-size: .75rem;
  color: var(--dim);
  cursor: pointer;
  letter-spacing: .06em;
  transition: all .12s;
  text-transform: uppercase;
  position: relative;
}
button:hover {
  color: var(--amber);
  border-color: var(--amber);
  background: rgba(255,176,0,.07);
  box-shadow: 0 0 10px rgba(255,176,0,.15), inset 0 0 10px rgba(255,176,0,.04);
}
button:active { transform: scale(.97); }

#compileBtn {
  color: var(--amber);
  border-color: var(--amber2);
  background: rgba(255,140,0,.08);
  box-shadow: 0 0 12px rgba(255,140,0,.2);
  font-size: .8rem;
}
#compileBtn:hover {
  background: rgba(255,140,0,.18);
  box-shadow: 0 0 20px rgba(255,140,0,.35);
}
#compileBtn:disabled { opacity:.3; cursor:not-allowed; transform:none; }

#clearBtn { color:var(--red); border-color:rgba(255,68,0,.4); }
#clearBtn:hover { background:rgba(255,68,0,.1); border-color:var(--red); box-shadow:0 0 10px rgba(255,68,0,.2); }

#copyHexBtn,#copyKeyBtn { color:var(--green); border-color:rgba(57,255,20,.3); }
#copyHexBtn:hover,#copyKeyBtn:hover { background:rgba(57,255,20,.07); border-color:var(--green); box-shadow:0 0 10px rgba(57,255,20,.15); }

#pasteBtn { color:var(--amber3); border-color:rgba(255,219,128,.3); }

.fmt-switch {
  margin-left:auto;
  display:flex;gap:0;
  border:1px solid var(--border2);
}
.fmt-btn {
  border:none;border-radius:0;
  padding:5px 16px;
  font-size:.72rem;
  color:var(--dim);
  background:transparent;
}
.fmt-btn.active {
  color:var(--bg);
  background:var(--amber);
  box-shadow:none;
}
.fmt-btn.active:hover {
  background:var(--amber2);
  box-shadow:none;
  border:none;
}
.fmt-btn:hover:not(.active){
  background:rgba(255,176,0,.1);
  border:none;
  box-shadow:none;
}

/* ── EXAMPLES ───────────────────────────────── */
.examples-row {
  border: 1px solid var(--border2);
  border-bottom: none;
  padding: 7px 16px;
  background: var(--paper);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.examples-label {
  font-size:.65rem;color:var(--dimmer);
  margin-right:4px;letter-spacing:.1em;
  text-transform:uppercase;
}
.ex-btn {
  font-size:.68rem;padding:3px 10px;
  color:var(--dimmer);
  border-color:var(--border);
}
.ex-btn:hover {
  color:var(--amber3);
  border-color:var(--amber3);
  background:rgba(255,219,128,.06);
  box-shadow:none;
}

/* ── PANELS ─────────────────────────────────── */
.main-border {
  border: 1px solid var(--border2);
  background: var(--paper);
  position: relative;
}
.main-border::before,
.main-border::after {
  content:'';position:absolute;
  width:10px;height:10px;
  border-color:var(--amber);border-style:solid;
}
.main-border::before { bottom:-1px;left:-1px; border-width:0 0 2px 2px; }
.main-border::after  { bottom:-1px;right:-1px; border-width:0 2px 2px 0; }

.panels {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
}
@media(max-width:640px){.panels{grid-template-columns:1fr}}

.panel { padding:14px 18px 18px; }
.panel:first-child { border-right:1px solid var(--border); }

.panel-label {
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:var(--dim);
  display:block;
  margin-bottom:8px;
}

textarea, #outputBox {
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--amber);
  font-family:'Share Tech Mono',monospace;
  font-size:12.5px;
  padding:12px 14px;
  outline:none;
  line-height:1.65;
  transition:border-color .2s;
}
textarea {
  resize:vertical;
  min-height:300px;
}
textarea:focus {
  border-color:var(--amber2);
  box-shadow:0 0 0 2px rgba(255,140,0,.12), inset 0 0 20px rgba(255,140,0,.03);
}
textarea::placeholder { color:var(--dimmer); }

#outputBox {
  min-height:300px;
  max-height:520px;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-all;
  color:var(--text);
  scrollbar-width:thin;
  scrollbar-color:var(--border2) transparent;
}
#outputBox::-webkit-scrollbar { width:4px; }
#outputBox::-webkit-scrollbar-thumb { background:var(--border2); }

/* ── STATUS ─────────────────────────────────── */
.status-row {
  border:1px solid var(--border2);
  border-top:1px solid var(--border);
  padding:7px 18px;
  background:var(--panel);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:8px;
}
.status-pill {
  font-size:.72rem;color:var(--dim);
  font-family:'Share Tech Mono',monospace;
  transition:color .3s;
}
.stats-pill {
  font-size:.68rem;color:var(--dimmer);
  font-family:'Share Tech Mono',monospace;
}

/* ── TABS ────────────────────────────────────── */
.tab-bar {
  display:flex;gap:0;
  border:1px solid var(--border2);
  border-bottom:none;
  background:var(--bg);
}
.tab-btn {
  flex:1;
  border:none;border-radius:0;
  padding:9px 0;
  font-size:.78rem;
  letter-spacing:.1em;
  color:var(--dim);
  background:transparent;
  border-right:1px solid var(--border);
}
.tab-btn:last-child { border-right:none; }
.tab-btn.active {
  color:var(--bg);
  background:var(--amber);
  box-shadow:none;
}
.tab-btn.active:hover { background:var(--amber2); border:none; box-shadow:none; }
.tab-btn:hover:not(.active) { background:rgba(255,176,0,.08); box-shadow:none; border-right:1px solid var(--border); }

/* ── ADDR INPUT ──────────────────────────────── */
.addr-inp {
  background:var(--bg);
  border:1px solid var(--border2);
  color:var(--amber);
  font-family:'Share Tech Mono',monospace;
  font-size:.75rem;
  padding:4px 8px;
  width:68px;
  text-align:center;
  outline:none;
}
.addr-inp:focus { border-color:var(--amber2); }

/* ── DECOMPILER OUTPUT ───────────────────────── */
#decompOutput {
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  min-height:300px;
  max-height:520px;
  overflow-y:auto;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;
  padding:10px 12px;
  scrollbar-width:thin;
  scrollbar-color:var(--border2) transparent;
}
#decompOutput::-webkit-scrollbar { width:4px; }
#decompOutput::-webkit-scrollbar-thumb { background:var(--border2); }

.gadget-line {
  display:flex;align-items:center;flex-wrap:wrap;
  gap:6px 10px;
  padding:4px 4px;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.gadget-line:hover { background:rgba(255,176,0,.04); }
.hex-badge {
  background:rgba(255,176,0,.1);
  border:1px solid var(--border2);
  padding:1px 8px;
  font-size:11px;
  color:var(--dim);
  letter-spacing:.04em;
}
.d-arrow { color:var(--dimmer); }
.d-addr  { color:var(--amber2);font-weight:bold;font-size:11px; }
.d-name  { color:var(--green); }
.d-unk   { color:var(--red);opacity:.8; }
.d-data  { color:var(--amber3); }
.d-label { color:var(--amber);font-weight:bold;font-size:12px;letter-spacing:.04em; }
.d-loc   { margin-left:auto;color:var(--dimmer);font-size:10px; }

.tok-hex   { color:#ffb000; }
.tok-key   { color:#ffe066; font-weight:bold; }
.tok-addr  { color:#ff8c00; }
.tok-err   { color:#ff4400; }
.tok-note  { color:#3d2c00; }
.tok-ok    { color:#39ff14; }
.tok-label { color:#7a5800; font-size:.85em; }
</style>
</head>
<body>

<!-- PYODIDE LOADING OVERLAY -->
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="title-block">
      <h1>580VNX <span>ROP</span> TOOLKIT</h1>
    </div>
    <div class="credit">by <b>@liemdeptraiqua</b> · Handsome Boy</div>
  </div>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabCompile">[ COMPILER ]</button>
    <button class="tab-btn" id="tabDecomp">[ DECOMPILER ]</button>
  </div>

  <!-- ══════════════ COMPILER SECTION ══════════════ -->
  <div id="sectionCompile">
    <div class="toolbar">
      <button id="compileBtn" disabled>[ COMPILE ]</button>
      <button id="pasteBtn">[ PASTE ]</button>
      <button id="clearBtn">[ CLEAR ]</button>
      <button id="copyHexBtn">[ COPY HEX ]</button>
      <span id="pyLoadLabel" style="color:var(--dim);font-size:.7rem;margin-left:4px">⏳ loading python...</span>
    </div>
    <div class="compile-loading-bar indeterminate" id="pyLoadBar">
      <div class="bar-fill" id="loaderBar"></div>
    </div>
    <div class="examples-row">
      <span class="examples-label">// examples</span>
      <button class="ex-btn" data-example="hello">hello_world</button>
      <button class="ex-btn" data-example="waitshift">waitshift</button>
      <button class="ex-btn" data-example="drawline">draw_line</button>
      <button class="ex-btn" data-example="loop">loop_goto</button>
      <button class="ex-btn" data-example="str">multi_str</button>
    </div>
    <div class="main-border">
      <div class="panels">
        <div class="panel">
          <span class="panel-label">// asm source</span>
          <textarea id="asmInput" spellcheck="false" placeholder="org 0xe9e0&#10;&#10;setlr&#10;xr0 = 0x1111, adr_of text&#10;printline&#10;render.ddd4&#10;waitshift&#10;&#10;text:&#10;str &quot;Hello~World&quot;"></textarea>
        </div>
        <div class="panel">
          <span class="panel-label">// output</span>
          <div id="outputBox"><span class="tok-note">// ready — press [ COMPILE ] or ctrl+enter</span></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-pill" id="statusMsg">&gt; ready_</div>
        <div class="stats-pill" id="statsMsg"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════ DECOMPILER SECTION ══════════════ -->
  <div id="sectionDecomp" style="display:none">
    <div class="toolbar">
      <button id="decompBtn">[ DECOMPILE ]</button>
      <button id="dPasteBtn">[ PASTE ]</button>
      <button id="dClearBtn">[ CLEAR ]</button>
      <button id="dCopyBtn">[ COPY ]</button>
      <div class="fmt-switch">
        <button class="fmt-btn active" id="dModeDetail">DETAILED</button>
        <button class="fmt-btn" id="dModeSimple">SIMPLE</button>
      </div>
      <span style="color:var(--dim);font-size:.7rem;margin-left:4px">dest:</span>
      <input class="addr-inp" id="startAddrInput" value="d730" maxlength="6">
      <span style="color:var(--dim);font-size:.7rem">src:</span>
      <input class="addr-inp" id="backupAddrInput" value="e9e0" maxlength="6">
    </div>
    <div class="main-border">
      <div class="panels">
        <div class="panel">
          <span class="panel-label">// hex input</span>
          <textarea id="hexInput" spellcheck="false" placeholder="d0 08 33 30 e0 a0 30 30 ..."></textarea>
        </div>
        <div class="panel">
          <span class="panel-label">// decompiled output</span>
          <div id="decompOutput"><span class="tok-note">// paste hex and press [ DECOMPILE ]</span></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-pill" id="dStatusMsg">&gt; ready_</div>
        <div class="stats-pill" id="dStatsMsg"></div>
      </div>
    </div>
  </div>

</div>

async function doCompile(fmt) {
  if (!pyodide) { setStatus('⏳ Python not ready', true); return; }
  const src = asmInput.value.trim();
  if (!src) { setStatus('⚠️ No source code', true); return; }

  compileBtn.disabled = true;
  setStatus('⏳ Compiling…');
  setOutput('<span class="tok-note">// Compiling…</span>');

  try {
    const t0 = performance.now();
    pyodide.globals.set('_src', src);
    pyodide.globals.set('_fmt', fmt);
    const res = await pyodide.runPythonAsync('compile_program(_src, _fmt)');
    const arr = res.toJs ? res.toJs() : res;
    const [out, labelInfo, byteCount] = arr;
    const dt = ((performance.now() - t0) / 1000).toFixed(3);

    const colonIdx = out.indexOf(':');
    const addr = out.slice(0, colonIdx);
    const bytes = out.slice(colonIdx + 1).trim();
    const byteArr = bytes.split(' ');

    let labelHtml = '';
    if (labelInfo) {
      const lines = labelInfo.split('\n').map(l => {
        const [name, adr] = l.split(': ');
        return `<span class="tok-note">; ${escHtml(name)}: <span class="tok-addr">${adr}</span></span>`;
      });
      labelHtml = '\n\n' + lines.join('\n');
    }

    lastHexResult = out;
    const colored = byteArr.map(b => `<span class="tok-hex">${b}</span>`).join(' ');
    setOutput(`<span class="tok-addr">${addr}:</span>\n${colored}${labelHtml}`);

    statsMsg.textContent = `bytes: ${byteCount} | time: ${dt}s`;
    setStatus(`> compiled ${byteCount} bytes_`);
  } catch(e) {
    const msg = e.message || String(e);
    setOutput(`<span class="tok-err">// Compile error:\n${escHtml(msg)}</span>`);
    setStatus('❌ compile error', true);
    statsMsg.textContent = '';
  } finally {
    compileBtn.disabled = false;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getPopSizes(name) {
    if (!name) return null;
    let pops=[],regex=/pop\s+([^,]+(?:,[^,]+)*)/gi,match;
    while ((match=regex.exec(name))!==null) {
        for (let t of match[1].split(',')) {
            t=t.trim();
            if (!t||t==='rt'||t==='pop'||t==='sp') continue;
            if (t==='ea'||t==='pc') pops.push(2);
            else if (t==='psw') pops.push(1);
            else if (t.startsWith('qr')) for(let i=0;i<4;i++) pops.push(2);
            else if (t.startsWith('xr')) for(let i=0;i<2;i++) pops.push(2);
            else if (t.startsWith('er')) pops.push(2);
            else if (t.startsWith('r')) pops.push(1);
        }
    }
    return pops.length?pops:null;
}
const MIN_VALID_CALL_ADDR=0x8000;
function normalizeAddress(addr) {
    if (addr===0x09c21) return 0x09c20;
    if (addr===0x0947e) return 0x0947c;
    if ((addr&1)&&addrToName.has(addr-1)) return addr-1;
    return addr;
}
function hexToBytes(hexStr) {
    let clean=hexStr.replace(/\s+/g,'');
    if (!clean) return [];
    if (clean.length%2) clean=clean.slice(0,-1);
    let bytes=[];
    for (let i=0;i<clean.length;i+=2) bytes.push(parseInt(clean.substr(i,2),16));
    return bytes;
}
const keyMap=new Map([[0x0180,"SHIFT"],[0x0280,"ALPHA"],[0x0440,"←"],[0x0880,"→"],[0x0480,"↑"],[0x0840,"↓"],

function parseToItems(bytes,startAddrDest,startAddrSrc) {
    let items=[],offset=0,i=0;
    while (i<bytes.length) {
        let ramAddrDest=startAddrDest+offset,ramAddrSrc=startAddrSrc+offset;
        if (i+3<bytes.length) {
            let zz=bytes[i],yy=bytes[i+1],third=bytes[i+2],fourth=bytes[i+3];
            if (third>=0x30&&third<=0x39&&fourth===0x30) {
                let X=third-0x30,rawAddr=(X<<16)|(yy<<8)|zz;
                if (rawAddr===0x03030){items.push({type:'data',hexBytes:[zz,yy],value:(yy<<8)|zz,ramAddrDest,ramAddrSrc});i+=2;offset+=2;continue;}
                if (rawAddr<MIN_VALID_CALL_ADDR){
                    items.push({type:'data',hexBytes:[zz,yy],value:(yy<<8)|zz,ramAddrDest,ramAddrSrc});offset+=2;
                    items.push({type:'data',hexBytes:[third,fourth],value:(fourth<<8)|third,ramAddrDest:startAddrDest+offset,ramAddrSrc:startAddrSrc+offset});
                    i+=4;offset+=2;continue;
                }
                let fa=normalizeAddress(rawAddr),nm=addrToName.get(fa);
                items.push({type:'call',hexBytes:[zz,yy,third,fourth],addr:fa,name:nm||null,ramAddrDest,ramAddrSrc});
                i+=4;offset+=4;
                if (nm&&!specialNoPopGadgets.has(nm)){
                    let ps=getPopSizes(nm);
                    if (ps&&ps.length>0){
                        let tot=ps.reduce((a,b)=>a+b,0);
                        if (i+tot<=bytes.length){
                            for (let sz of ps){
                                let db=bytes.slice(i,i+sz),val=0;
                                for (let j=0;j<sz;j++) val|=(db[j]<<(8*j));
                                items.push({type:'data',hexBytes:db,value:val,ramAddrDest:startAddrDest+offset,ramAddrSrc:startAddrSrc+offset});
                                i+=sz;offset+=sz;
                            }
                            continue;
                        }
                    }
                }
                continue;
            }
        }
        if (i+1<bytes.length){
            items.push({type:'data',hexBytes:[bytes[i],bytes[i+1]],value:(bytes[i+1]<<8)|bytes[i],ramAddrDest,ramAddrSrc});
            i+=2;offset+=2;
        } else {
            items.push({type:'data',hexBytes:[bytes[i]],value:bytes[i],ramAddrDest,ramAddrSrc});
            i++;offset++;
        }
    }
    return items;
}
function resequenceLabels(items){
    let map=new Map(),c=1;
    for (let it of items) if (it.type==='label'&&!map.has(it.label)) map.set(it.label,`label${c++}`);
    for (let it of items){
        if (it.type==='label') it.label=map.get(it.label)||it.label;
        if (it.type==='data'&&it.labelRef) it.labelRef.label=map.get(it.labelRef.label)||it.labelRef.label;
    }
    return items;
}
function addLabelReferences(items,sDest,sSrc){
    let ai=new Map();
    for (let idx=0;idx<items.length;idx++){ai.set(items[idx].ramAddrDest,idx);ai.set(items[idx].ramAddrSrc,idx);}
    let lc=1,lmap=new Map();
    for (let it of items){
        if (it.type==='data'&&it.hexBytes.length===2&&ai.has(it.value)){
            let ti=ai.get(it.value),tit=items[ti];
            let isSrc=tit.ramAddrSrc===it.value?true:tit.ramAddrDest===it.value?false:null;
            if (isSrc===null) continue;
            if (!lmap.has(it.value)) lmap.set(it.value,`label${lc++}`);
            it.labelRef={label:lmap.get(it.value),isSrc,originalValue:it.value};
        }
    }
    let li=[];
    for (let [addr,ln] of lmap.entries()){let ti=ai.get(addr);if(ti!==undefined)li.push({type:'label',label:ln,insertBefore:ti,addr});}
    li.sort((a,b)=>b.insertBefore-a.insertBefore);
    for (let l of li) items.splice(l.insertBefore,0,{type:'label',label:l.label,addr:l.addr});
    let merged=false;
    do {
        merged=false;
        for (let i=0;i<items.length-1;i++){
            if (items[i].type==='label'&&items[i+1].type==='label'){
                let keep=items[i].label,rem=items[i+1].label;
                items.splice(i+1,1);
                for (let it of items) if (it.type==='data'&&it.labelRef&&it.labelRef.label===rem) it.labelRef.label=keep;
                merged=true;break;
            }
        }
    } while (merged);
    return items;
}
function getDataDisplay(it){
    if (it.labelRef){const r=it.labelRef;return r.isSrc?`adr_of [+4784] ${r.label}`:`adr_of ${r.label}`;}
    let v=it.hexBytes.length===2?`0x${it.value.toString(16).toUpperCase().padStart(4,'0')}`:`0x${it.value.toString(16).toUpperCase().padStart(2,'0')}`;
    if (it.hexBytes.length===2&&keyMap.has(it.value)) v+=` # [${keyMap.get(it.value)}]`;
    if (it.hexBytes.length===2&&addrNameMap.has(it.value)) v+=` # ${addrNameMap.get(it.value)}`;
    return v;
}
function fmtA(n){return '0x'+n.toString(16).toLowerCase();}
function renderItems(items,container){
    container.innerHTML='';
    const frag=document.createDocumentFragment();
    for (let it of items){
        const d=document.createElement('div');d.className='gadget-line';
        if (it.type==='label'){
            d.style.paddingLeft='0';
            const s=document.createElement('span');s.className='d-label';s.textContent=`${it.label}:`;d.appendChild(s);
            const loc=document.createElement('span');loc.className='d-loc';loc.textContent=fmtA(it.addr);d.appendChild(loc);
        } else {
            d.style.paddingLeft='14px';
            const badge=document.createElement('span');badge.className='hex-badge';
            badge.textContent=it.hexBytes.map(b=>b.toString(16).padStart(2,'0')).join(' ');d.appendChild(badge);
            const arr=document.createElement('span');arr.className='d-arrow';arr.textContent='➜';d.appendChild(arr);
            if (it.type==='call'){
                const as=it.addr.toString(16).toUpperCase().padStart(5,'0');
                const a=document.createElement('span');a.className='d-addr';a.textContent=as;d.appendChild(a);
                const ns=document.createElement('span');
                if (it.name){ns.className='d-name';ns.textContent=`→ ${it.name}`;}
                else{ns.className='d-unk';ns.textContent=`→ call ${as}`;}
                d.appendChild(ns);
            } else {
                const ds=document.createElement('span');ds.className='d-data';ds.textContent=`→ ${getDataDisplay(it)}`;d.appendChild(ds);
            }
            const loc=document.createElement('span');loc.className='d-loc';
            loc.textContent=`${fmtA(it.ramAddrDest)} ${fmtA(it.ramAddrSrc)}`;d.appendChild(loc);
        }
        frag.appendChild(d);
    }
    container.appendChild(frag);
}

let dItems=[],dByteCount=0,dMode='detail';

function dSetStatus(t,err=false){dStatus.textContent=t;dStatus.style.color=err?'var(--red)':'var(--dim)';}

function formatSimple(){
    return dItems.map(it=>{
        if (it.type==='label') return `${it.label}:`;
        if (it.type==='call') return `  ${it.name||'call '+it.addr.toString(16).toUpperCase().padStart(5,'0')}`;
        return `  ${getDataDisplay(it)}`;
    }).join('\n');
}

function refreshDecomp(){
    if (!dItems.length) return;
    if (dMode==='detail') renderItems(dItems,decompOut);
    else { decompOut.innerText=formatSimple(); }
}

dModeDetail.onclick=()=>{
    dMode='detail';
    dModeDetail.classList.add('active'); dModeSimple.classList.remove('active');
    refreshDecomp();
};
dModeSimple.onclick=()=>{
    dMode='simple';
    dModeSimple.classList.add('active'); dModeDetail.classList.remove('active');
    refreshDecomp();
};

decompBtn.onclick=()=>{
    const raw=hexInput.value.trim();
    if (!raw){dSetStatus('> no input_',true);return;}
    let dest=parseInt(startAddrIn.value.trim(),16),src=parseInt(backupAddrIn.value.trim(),16);
    if (isNaN(dest)) dest=0xd730;
    if (isNaN(src)) src=0xe9e0;
    dSetStatus('> decompiling…');
    setTimeout(()=>{
        try {
            let bytes=hexToBytes(raw);
            if (!bytes.length) throw new Error('Invalid hex');
            dByteCount=bytes.length;
            let items=parseToItems(bytes,dest,src);
            items=addLabelReferences(items,dest,src);
            items=resequenceLabels(items);
            dItems=items;
            refreshDecomp();
            dStats.textContent=`bytes: ${dByteCount} | items: ${items.length}`;
            dSetStatus(`> ok — ${items.length} items_`);
        } catch(e){
            decompOut.innerHTML=`<span style="color:var(--red)">// Error: ${e.message}</span>`;
            dSetStatus('> error_',true);dStats.textContent='';
        }
    },10);
};
dCopyBtn.onclick=()=>{
    const txt=formatSimple();
    if (!txt){dSetStatus('> nothing to copy_',true);return;}
    navigator.clipboard.writeText(txt).then(()=>dSetStatus('> copied_')).catch(()=>dSetStatus('> copy failed_',true));
};
dClearBtn.onclick=()=>{
    hexInput.value='';
    decompOut.innerHTML='<span class="tok-note">// paste hex and press [ DECOMPILE ]</span>';
    dItems=[];dByteCount=0;dStats.textContent='';dSetStatus('> cleared_');
};
dPasteBtn.onclick=async()=>{
    try{hexInput.value=await navigator.clipboard.readText();dSetStatus('> pasted_');}
    catch{dSetStatus('> clipboard error_',true);}
};
