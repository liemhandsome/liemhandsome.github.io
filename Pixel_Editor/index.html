<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIXEL EDITOR · 580VNX · Handsome Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0a0800;
  --paper:  #110e00;
  --panel:  #160f00;
  --border: #3a2800;
  --border2:#4d3500;
  --amber:  #ffb000;
  --amber2: #ff8c00;
  --amber3: #ffdb80;
  --dim:    #7a5800;
  --dimmer: #3d2c00;
  --red:    #ff4400;
  --green:  #39ff14;
  --text:   #ffe066;
}
*{box-sizing:border-box;margin:0;padding:0}

/* CRT scanline */
body::before {
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.13) 2px,rgba(0,0,0,0.13) 4px);
  pointer-events:none;z-index:9999;
}

body {
  background:var(--bg);
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:16px;color:var(--amber);
  background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,160,0,0.06) 0%,transparent 70%);
}

/* ── WRAP ── */
.wrap{width:100%;max-width:700px;}

/* ── HEADER ── */
.header {
  border:1px solid var(--border2);border-bottom:none;
  padding:10px 20px;background:var(--panel);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;position:relative;
}
.header::before,.header::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--amber);border-style:solid;}
.header::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.header::after {top:-1px;right:-1px;border-width:2px 2px 0 0;}

h1 {
  white-space: nowrap;    
  font-family:'Bebas Neue',sans-serif;font-size:1.6rem;
  letter-spacing:.12em;color:var(--amber);
  text-shadow:0 0 16px var(--amber2),0 0 40px rgba(255,140,0,.3);
  animation:flicker 8s infinite;
  /* striped effect on title */
  background:repeating-linear-gradient(
    90deg,
    var(--amber) 0px, var(--amber) 6px,
    var(--amber2) 6px, var(--amber2) 12px
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
@keyframes flicker{0%,95%,100%{opacity:1;}96%{opacity:.85;}97%{opacity:1;}98%{opacity:.7;}99%{opacity:1;}}

h1 span{
  background:repeating-linear-gradient(90deg,var(--amber3) 0px,var(--amber3) 6px,var(--amber2) 6px,var(--amber2) 12px);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.credit{font-size:.7rem;color:var(--dim);border:1px solid var(--border);padding:3px 10px;letter-spacing:.08em;}
.credit b{color:var(--amber2);}

/* ── TOOLBAR ── */
.toolbar {
  border:1px solid var(--border2);border-bottom:none;
  padding:8px 16px;background:var(--paper);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}
.toolbar-section {
  border:1px solid var(--border2);border-bottom:none;
  padding:6px 16px;background:var(--paper);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}
.section-label{font-size:.6rem;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-right:4px;}

button {
  background:transparent;border:1px solid var(--border2);
  padding:5px 14px;font-family:'Share Tech Mono',monospace;
  font-size:.75rem;color:var(--dim);cursor:pointer;
  letter-spacing:.06em;transition:all .12s;text-transform:uppercase;
}
button:hover{color:var(--amber);border-color:var(--amber);background:rgba(255,176,0,.07);box-shadow:0 0 10px rgba(255,176,0,.15);}
button:active{transform:scale(.97);}

input[type="number"] {
  background:var(--bg);border:1px solid var(--border2);
  color:var(--amber);font-family:'Share Tech Mono',monospace;
  font-size:.75rem;padding:5px 8px;width:56px;text-align:center;outline:none;
}
input[type="number"]:focus{border-color:var(--amber2);}
input[type="file"]{
  background:transparent;border:1px dashed var(--border2);
  color:var(--dim);font-family:'Share Tech Mono',monospace;
  font-size:.7rem;padding:5px 8px;outline:none;
  cursor:pointer;
}

/* ── MAIN BORDER ── */
.main-border{
  border:1px solid var(--border2);background:var(--paper);position:relative;
}
.main-border::before,.main-border::after{content:'';position:absolute;width:10px;height:10px;border-color:var(--amber);border-style:solid;}
.main-border::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
.main-border::after {bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

/* ── CANVAS AREA ── */
.canvas-wrap{padding:12px;display:flex;justify-content:center;overflow-x:auto;border-bottom:1px solid var(--border);}
#pixelCanvas{
  display:block;border:1px solid var(--border2);
  image-rendering:crisp-edges;touch-action:none;
  background:#1a1400;cursor:crosshair;
  max-width:100%;      /* thêm dòng này */
  height:auto;         /* thêm dòng này */
}
/* ── OUTPUT SECTION ── */
.output-section{padding:12px 16px;border-bottom:1px solid var(--border);}
.panel-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.16em;color:var(--dimmer);display:block;margin-bottom:6px;}

textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--amber3);font-family:'Share Tech Mono',monospace;
  font-size:11px;padding:10px 12px;resize:vertical;outline:none;
  line-height:1.6;
}
textarea:focus{border-color:var(--amber2);}

/* ── STATUS BAR ── */
.status-row{
  border-top:1px solid var(--border);padding:7px 18px;background:var(--panel);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.status-pill{font-size:.72rem;color:var(--dim);font-family:'Share Tech Mono',monospace;transition:color .3s;}
.stats-pill{font-size:.68rem;color:var(--dimmer);}

/* ── PREVIEW ── */
#preview{display:block;margin:8px auto;border:1px solid var(--border);max-width:100%;height:auto;}

.addr-inp{
  background:var(--bg);border:1px solid var(--border2);color:var(--amber);
  font-family:'Share Tech Mono',monospace;font-size:.75rem;padding:4px 8px;
  width:50px;text-align:center;outline:none;
}

/* ── THRESHOLD SLIDER ── */
.threshold-row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap;}
.threshold-row label{font-size:.65rem;color:var(--dim);letter-spacing:.06em;white-space:nowrap;}
.threshold-row .val{font-size:.72rem;color:var(--amber2);min-width:28px;text-align:center;}
input[type="range"]{
  -webkit-appearance:none;appearance:none;
  flex:1;min-width:80px;max-width:200px;height:4px;
  background:linear-gradient(90deg,var(--border2) 0%,var(--amber) 100%);
  border:1px solid var(--border2);outline:none;cursor:pointer;
  touch-action:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  background:var(--amber2);border:1px solid var(--amber);
  cursor:pointer;
}
input[type="range"]::-moz-range-thumb{
  width:14px;height:14px;background:var(--amber2);
  border:1px solid var(--amber);cursor:pointer;border-radius:0;
}
.thr-btn{padding:3px 7px;font-size:.68rem;min-width:32px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <h1>PIXEL <span>EDITOR</span> 580VNX</h1>
    <div class="credit">by <b>@liemdeptraiqua</b> · Handsome Boy</div>
  </div>

  <!-- TOOLBAR: CREATE -->
  <div class="toolbar">
    <button id="createGridBtn">[ TẠO LƯỚI ]</button>
    <button id="clearGridBtn">[ XÓA ]</button>
    <button id="invertBtn">[ ĐẢO NGƯỢC ]</button>
    <button id="exportBtn">[ XUẤT HEX ]</button>
    <button id="downloadPngBtn">[ TẢI ẢNH PNG ]</button>
    <span style="color:var(--dim);font-size:.7rem;margin-left:4px">W:</span>
    <input class="addr-inp" type="number" id="cols" value="16" min="1" max="192">
    <span style="color:var(--dim);font-size:.7rem">H:</span>
    <input class="addr-inp" type="number" id="rows" value="16" min="1" max="63">
  </div>

  <!-- MAIN -->
  <div class="main-border">

    <!-- CANVAS -->
    <div class="canvas-wrap">
      <canvas id="pixelCanvas" width="512" height="512"></canvas>
    </div>

    <!-- BINARY OUTPUT -->
    <div class="output-section">
      <span class="panel-label">// binary</span>
      <textarea id="binaryOut" rows="4" readonly></textarea>
      <div style="margin-top:6px">
        <button class="copy-btn" data-target="binaryOut">[ SAO CHÉP BIN ]</button>
      </div>
    </div>

    <!-- HEX OUTPUT -->
    <div class="output-section">
      <span class="panel-label">// hex output</span>
      <textarea id="hexOut" rows="2" readonly></textarea>
      <div style="margin-top:6px">
        <button class="copy-btn" data-target="hexOut">[ SAO CHÉP HEX ]</button>
      </div>
    </div>

    <!-- IMPORT HEX -->
    <div class="output-section">
      <span class="panel-label">// import hex → pixel</span>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
        <span style="color:var(--dim);font-size:.7rem">W:</span>
        <input class="addr-inp" type="number" id="hexW" value="16" min="1" max="192">
        <span style="color:var(--dim);font-size:.7rem">H:</span>
        <input class="addr-inp" type="number" id="hexH" value="16" min="1" max="63">
      </div>
      <textarea id="hexInput" placeholder="AA BB CC DD ..." rows="2"></textarea>
      <div style="margin-top:6px"><button id="loadHexBtn">[ TẢI HEX ]</button></div>
    </div>

    <!-- IMPORT IMAGE -->
    <div class="output-section">
      <span class="panel-label">// import ảnh → pixel</span>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
        <span style="color:var(--dim);font-size:.7rem">W:</span>
        <input class="addr-inp" type="number" id="imgW" value="32" min="1" max="192">
        <span style="color:var(--dim);font-size:.7rem">H:</span>
        <input class="addr-inp" type="number" id="imgH" value="32" min="1" max="63">
      </div>
      <input type="file" id="imageLoader" accept="image/*">
      <div class="threshold-row">
        <label>THR:</label>
        <button class="thr-btn" data-step="-10">-10</button>
        <button class="thr-btn" data-step="-1">-1</button>
        <input type="range" id="threshold" min="0" max="255" value="128">
        <button class="thr-btn" data-step="1">+1</button>
        <button class="thr-btn" data-step="10">+10</button>
        <span class="val" id="thresholdVal">128</span>
      </div>
      <div style="margin-top:6px"><button id="processImageBtn">[ CHUYỂN ĐỔI ]</button></div>
      <canvas id="preview" width="256" height="128"></canvas>
    </div>

    <!-- STATUS -->
    <div class="status-row">
      <div class="status-pill" id="statusMsg">&gt; ready_</div>
      <div class="stats-pill" id="statsMsg">canvas: 16×16</div>
    </div>

  </div>
</div>

<script>
(function(){
  const canvas=document.getElementById('pixelCanvas');
  const ctx=canvas.getContext('2d');
  const colsInput=document.getElementById('cols');
  const rowsInput=document.getElementById('rows');
  const binaryOut=document.getElementById('binaryOut');
  const hexOut=document.getElementById('hexOut');
  const hexW=document.getElementById('hexW');
  const hexH=document.getElementById('hexH');
  const hexInput=document.getElementById('hexInput');
  const imgW=document.getElementById('imgW');
  const imgH=document.getElementById('imgH');
  const imageLoader=document.getElementById('imageLoader');
  const preview=document.getElementById('preview');
  const statusMsg=document.getElementById('statusMsg');
  const statsMsg=document.getElementById('statsMsg');

  let rows=16,cols=16,grid=[],cellSize=32,isDrawing=false,drawMode=true,lastRow=-1,lastCol=-1;

  function setStatus(t,err=false){statusMsg.textContent=t;statusMsg.style.color=err?'var(--red)':'var(--dim)';}

  function createGrid(r,c){
    r=r||parseInt(rowsInput.value)||16;
    c=c||parseInt(colsInput.value)||16;
    r=Math.min(63,Math.max(1,r));
    c=Math.min(192,Math.max(1,c));
    rows=r;cols=c;
    grid=Array.from({length:rows},()=>new Array(cols).fill(false));
    cellSize=Math.max(4,Math.min(32,Math.floor(Math.min(400/cols,400/rows))));
    canvas.width=cols*cellSize;canvas.height=rows*cellSize;
    redrawCanvas();
    statsMsg.textContent=`canvas: ${cols}×${rows}`;
    setStatus('> grid created_');
  }

  function redrawCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(grid[r][c]){ctx.fillStyle='#ff8c00';ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);}
      else{
        ctx.fillStyle='#1a1400';ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);
        ctx.strokeStyle='#3a2a00';ctx.lineWidth=0.5;ctx.strokeRect(c*cellSize,r*cellSize,cellSize,cellSize);
      }
    }
  }

  function setPixel(row,col,active){
    if(row<0||row>=rows||col<0||col>=cols) return;
    if(grid[row][col]===active) return;
    grid[row][col]=active;
    ctx.fillStyle=active?'#ff8c00':'#1a1400';
    ctx.fillRect(col*cellSize,row*cellSize,cellSize,cellSize);
    if(!active){ctx.strokeStyle='#3a2a00';ctx.lineWidth=0.5;ctx.strokeRect(col*cellSize,row*cellSize,cellSize,cellSize);}
  }

  function downloadPng(){
    const out=document.createElement('canvas');
    out.width=cols;out.height=rows;
    const octx=out.getContext('2d');
    octx.fillStyle='#000000';octx.fillRect(0,0,cols,rows);
    octx.fillStyle='#ffffff';
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(grid[r][c]) octx.fillRect(c,r,1,1);
    }
    out.toBlob(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=`pixelart_${cols}x${rows}.png`;
      document.body.appendChild(a);a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },'image/png');
    setStatus(`> png exported (${cols}x${rows})_`);
  }

  function drawLine(x0,y0,x1,y1,mode){
    const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
    let err=dx-dy,x=x0,y=y0;
    while(true){setPixel(y,x,mode);if(x===x1&&y===y1) break;const e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}
  }

  function getCellFromClient(clientX,clientY){
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
    const cx=(clientX-rect.left)*scaleX,cy=(clientY-rect.top)*scaleY;
    if(cx<0||cx>=canvas.width||cy<0||cy>=canvas.height) return null;
    return{row:Math.floor(cy/cellSize),col:Math.floor(cx/cellSize)};
  }

  function handleStart(e){
    e.preventDefault();const client=e.touches?e.touches[0]:e;
    const pos=getCellFromClient(client.clientX,client.clientY);if(!pos) return;
    const{row,col}=pos;drawMode=!grid[row][col];isDrawing=true;lastRow=row;lastCol=col;setPixel(row,col,drawMode);
  }
  function handleMove(e){
    if(!isDrawing) return;e.preventDefault();
    const client=e.touches?e.touches[0]:e;
    const pos=getCellFromClient(client.clientX,client.clientY);if(!pos) return;
    const{row,col}=pos;if(row===lastRow&&col===lastCol) return;
    drawLine(lastCol,lastRow,col,row,drawMode);lastRow=row;lastCol=col;
  }
  function handleEnd(e){e.preventDefault();isDrawing=false;lastRow=lastCol=-1;}

  canvas.addEventListener('touchstart',handleStart,{passive:false});
  canvas.addEventListener('touchmove',handleMove,{passive:false});
  canvas.addEventListener('touchend',handleEnd);
  canvas.addEventListener('touchcancel',handleEnd);
  canvas.addEventListener('mousedown',handleStart);
  window.addEventListener('mousemove',handleMove);
  window.addEventListener('mouseup',handleEnd);

  function generateData(){
    let bin='',hex=[];
    for(let r=0;r<rows;r++){
      let line='';
      for(let c=0;c<cols;c++) line+=grid[r][c]?'1':'0';
      bin+=line+'\n';
      for(let k=0;k<line.length;k+=8) hex.push(parseInt(line.slice(k,k+8).padEnd(8,'0'),2).toString(16).toUpperCase().padStart(2,'0'));
    }
    binaryOut.value=bin.trim();hexOut.value=hex.join(' ');
    setStatus(`> exported ${hex.length} bytes_`);
    statsMsg.textContent=`canvas: ${cols}×${rows} | bytes: ${hex.length}`;
  }

  function clearGrid(){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) grid[r][c]=false;
    redrawCanvas();binaryOut.value=hexOut.value='';setStatus('> cleared_');
  }

  function copyText(text){
    navigator.clipboard?.writeText(text).then(()=>setStatus('> copied_')).catch(()=>{
      const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);setStatus('> copied_');
    });
  }

  function loadHex(){
  const w=parseInt(hexW.value),h=parseInt(hexH.value);
  if(w<1||h<1||w>192||h>63) return;
  createGrid(h,w);
  const bytes=hexInput.value.trim().split(/\s+/).filter(b=>/^[0-9A-Fa-f]+$/.test(b));
  let bin='';
  bytes.forEach(b=>bin+=parseInt(b,16).toString(2).padStart(8,'0'));
  let idx=0;
  for(let r=0;r<h;r++){
    for(let c=0;c<w;c++){
      if(bin[idx]==='1') setPixel(r,c,true);
      idx++;
    }
  }
  generateData();
  setStatus('> hex loaded_');
}

  const threshold=document.getElementById('threshold');
  const thresholdVal=document.getElementById('thresholdVal');
  function updateThreshold(val){
    threshold.value=Math.min(255,Math.max(0,val));
    thresholdVal.textContent=threshold.value;
    if(imageLoader.files[0]) processImage();
  }
  threshold.addEventListener('input',()=>updateThreshold(parseInt(threshold.value)));
  threshold.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.querySelectorAll('.thr-btn').forEach(btn=>{
    btn.addEventListener('click',()=>updateThreshold(parseInt(threshold.value)+parseInt(btn.dataset.step)));
  });

  function processImage(){
    const file=imageLoader.files[0];if(!file) return setStatus('> no image_',true);
    let w=Math.min(192,Math.max(1,parseInt(imgW.value))),h=Math.min(63,Math.max(1,parseInt(imgH.value)));
    const thr=parseInt(threshold.value);
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        createGrid(h,w);
        const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
        const tCtx=tmp.getContext('2d');tCtx.drawImage(img,0,0,w,h);
        const data=tCtx.getImageData(0,0,w,h).data;
        const maxPW=Math.min(600,Math.floor((document.querySelector('.output-section').clientWidth||400)-24));
        const px=Math.max(1,Math.floor(maxPW/w));
        preview.width=w*px;preview.height=h*px;
        const pctx=preview.getContext('2d');
        let idx=0;
        for(let y=0;y<h;y++) for(let x=0;x<w;x++){
          const gray=(data[idx]+data[idx+1]+data[idx+2])/3,active=gray<thr;
          if(active) setPixel(y,x,true);
          pctx.fillStyle=active?'#ff8c00':'#0a0800';pctx.fillRect(x*px,y*px,px,px);
          idx+=4;
        }
        generateData();setStatus(`> image converted (thr=${thr})_`);
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  }

  function invertGrid(){
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) grid[r][c]=!grid[r][c];
    redrawCanvas();
    generateData();
    setStatus('> inverted_');
  }

  document.getElementById('createGridBtn').onclick=()=>{createGrid();generateData();};
  document.getElementById('clearGridBtn').onclick=clearGrid;
  document.getElementById('invertBtn').onclick=invertGrid;
  document.getElementById('exportBtn').onclick=generateData;
  document.getElementById('downloadPngBtn').onclick=downloadPng;
  document.getElementById('loadHexBtn').onclick=loadHex;
  document.getElementById('processImageBtn').onclick=processImage;
  document.querySelectorAll('[data-target]').forEach(btn=>{
    btn.onclick=()=>copyText(document.getElementById(btn.dataset.target).value);
  });
  // Tự động giới hạn giá trị input khi nhập tay
  [colsInput, rowsInput, hexW, hexH, imgW, imgH].forEach(inp => {
    inp.addEventListener('input', function() {
      const max = parseInt(this.max) || (this.id.includes('W') ? 192 : 63);
      if (this.value > max) this.value = max;
      if (this.value < 1) this.value = 1;
    });
  });

  createGrid();
})();
</script>
</body>
</html>
