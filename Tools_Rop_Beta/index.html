<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>580VNX ROP Toolkit · Handsome Boy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>580VNX <span>ROP</span> TOOLKIT</h1>
    <div class="credit">by <b>@liemdeptraiqua</b> · Handsome Boy</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabCompile">[ COMPILER ]</button>
    <button class="tab-btn" id="tabDecomp">[ DECOMPILER ]</button>
  </div>

  <!-- COMPILER SECTION -->
  <div id="sectionCompile">
    <div class="toolbar">
      <button id="compileBtn" disabled>[ COMPILE ]</button>
      <button id="pasteBtn">[ PASTE ]</button>
      <button id="clearBtn">[ CLEAR ]</button>
      <button id="copyHexBtn">[ COPY HEX ]</button>
      <button id="patchDisasBtn" style="color:var(--green);border-color:rgba(57,255,20,.3)" title="Patch disas.txt labels to match gadget names">[ PATCH DISAS ]</button>
      <span id="pyLabel" style="color:var(--dim);font-size:.7rem;margin-left:6px">&#9203; loading...</span>
    </div>
    <div class="toolbar" id="ghBar" style="display:none">
      <span style="color:var(--dimmer);font-size:.65rem;letter-spacing:.1em">// github</span>
      <input id="ghRepo" placeholder="owner/repo" style="background:var(--bg);border:1px solid var(--border2);color:var(--amber);font-family:'Share Tech Mono',monospace;font-size:.72rem;padding:4px 8px;outline:none;width:160px">
      <input id="ghToken" type="password" placeholder="ghp_token..." style="background:var(--bg);border:1px solid var(--border2);color:var(--amber);font-family:'Share Tech Mono',monospace;font-size:.72rem;padding:4px 8px;outline:none;width:180px">
      <button id="ghSaveBtn" style="font-size:.7rem;padding:4px 10px">[ SAVE ]</button>
      <button id="ghCommitBtn" style="color:var(--green);border-color:rgba(57,255,20,.3);font-size:.7rem;padding:4px 10px" disabled>[ COMMIT DISAS ]</button>
      <span id="ghStatus" style="font-size:.68rem;color:var(--dimmer)"></span>
    </div>
    <div class="load-bar run" id="pyBar"><div class="fill" id="pyFill"></div></div>
    <div class="examples-row">
      <span class="ex-label">// examples</span>
      <button class="ex-btn" data-ex="hello">hello_world</button>
      <button class="ex-btn" data-ex="waitshift">waitshift</button>
      <button class="ex-btn" data-ex="drawline">draw_line</button>
      <button class="ex-btn" data-ex="loop">loop_goto</button>
    </div>
    <div class="main-border">
      <div class="panels">
        <div class="panel">
          <span class="panel-label">// asm source</span>
          <textarea id="asmInput" spellcheck="false" placeholder="org 0xe9e0&#10;&#10;setlr&#10;xr0 = 0x1111, adr_of text&#10;printline&#10;render.ddd4&#10;&#10;text:&#10;hex 48 65 6c 6c 6f&#10;0x00"></textarea>
        </div>
        <div class="panel">
          <span class="panel-label">// output</span>
          <div id="outputBox"><span class="tok-note">// ready &#8212; press [ COMPILE ] or ctrl+enter</span></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-pill" id="statusMsg">&gt; ready_</div>
        <div class="stats-pill" id="statsMsg"></div>
      </div>
    </div>
  </div>

  <!-- DECOMPILER SECTION -->
  <div id="sectionDecomp" style="display:none">
    <div class="toolbar">
      <button id="decompBtn">[ DECOMPILE ]</button>
      <button id="dPasteBtn">[ PASTE ]</button>
      <button id="dClearBtn">[ CLEAR ]</button>
      <button id="dCopyBtn">[ COPY ]</button>
      <div class="fmt-switch">
        <button class="fmt-btn active" id="dDetail">DETAILED</button>
        <button class="fmt-btn" id="dSimple">SIMPLE</button>
      </div>
      <span style="color:var(--dim);font-size:.7rem;margin-left:6px">dest:</span>
      <input class="addr-inp" id="addrDest" value="d730" maxlength="6">
      <span style="color:var(--dim);font-size:.7rem">src:</span>
      <input class="addr-inp" id="addrSrc" value="e9e0" maxlength="6">
    </div>
    <div class="main-border">
      <div class="panels">
        <div class="panel">
          <span class="panel-label">// hex input</span>
          <textarea id="hexInput" spellcheck="false" placeholder="d0 08 33 30 e0 a0 30 30 ..."></textarea>
        </div>
        <div class="panel">
          <span class="panel-label">// decompiled output</span>
          <div id="decompOut"><span class="tok-note">// paste hex and press [ DECOMPILE ]</span></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-pill" id="dStatus">&gt; ready_</div>
        <div class="stats-pill" id="dStats"></div>
      </div>
    </div>
  </div>

</div>
